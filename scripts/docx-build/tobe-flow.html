<text x="120" y="58" font-size="25" font-weight="700" fill="#111827">AI 数智化后的岗位服务需求单流程（To-Be）</text>
<text x="120" y="88" font-size="13.5" fill="#6B7280">针对现状 5 个断点重设：补单留痕 → 证据锚定 → 双条件判版 → 具名审批 → 全程审计；只读接入，不自动决定派遣资格</text>

<rect x="120" y="140" width="560" height="54" rx="27" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="140" y="158" font-size="15" font-weight="700" fill="#2C2C2A">客户提出或变更岗位需求</text>
<text x="140" y="181" font-size="12" fill="#5F5E5A">三入口：电话 · 群消息 · 正式需求单 · f01 f10</text>

<text x="760" y="275" font-size="12" fill="#791F1F">先暂停、不默认放行，避免旧条件继续流转 · f44</text>

<text x="140" y="654" font-size="12" fill="#0F6E56">版本有效期 AND 确认状态；文件名与戳记不参与判定 · f24</text>

<path d="M680 932L736 932" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="740" y="903" width="620" height="58" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>

<text x="760" y="945" font-size="12" fill="#791F1F">未确认项不得归到对方名下；退回动作同样留痕 · f25</text>

<path d="M400 970L400 996" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="414" y="988" font-size="12" fill="#6B7280">是</text>

<text x="140" y="1042" font-size="12" fill="#185FA5">接收人、版本、未结项全部落库，可反查 · f20 f45</text>

<path d="M1050 1155L1050 1272L60 1272L60 641L116 641" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/>

<rect x="120" y="1300" width="1240" height="36" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/>
<text x="140" y="1318" font-size="12.5" fill="#444441" dominant-baseline="central">横切能力 · 全流程审计留痕：谁查过 · 用哪个版本 · 提出什么建议 · 谁确认（f45）｜只读导出，写回、外部消息与执行接口均不开放（f32）</text>

<rect x="120" y="1352" width="18" height="18" rx="9" fill="#EAF3DE" stroke="#639922" stroke-width="0.8"/>
<text x="146" y="1361" font-size="12.5" fill="#444441" dominant-baseline="central">解决断点</text>
