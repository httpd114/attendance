<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"></span>
      <div>
        <strong>制度助手</strong>
        <small>管理后台</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="/admin" class="nav-item ">
        <span class="nav-dot"></span>概览
      </a>
      <a href="/admin/knowledge" class="nav-item active">
        <span class="nav-dot"></span>制度知识库
      </a>
      <a href="/admin/prompts" class="nav-item ">
        <span class="nav-dot"></span>提示词模板
      </a>
      <a href="/admin/audit" class="nav-item ">
        <span class="nav-dot"></span>对话审计
      </a>
      <a href="/admin/users" class="nav-item ">
        <span class="nav-dot"></span>用户管理
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <span class="avatar">系</span>
        <div class="user-meta">
          <strong>系统管理员</strong>
          <small>管理员 · A000</small>
        </div>
      </div>
      <a href="/logout" class="btn btn-ghost btn-sm btn-block">退出登录</a>
    </div>
  </aside>

  <main class="content">
    <header class="content-head">
      <h1>制度知识库</h1>
      <div class="content-head-right">
<form method="post" action="/admin/knowledge/reindex">
  <button class="btn btn-secondary btn-sm" type="submit">重建索引</button>
</form>
</div>
    </header>
    <div class="content-body">
      
      

<!-- ============ 上传区 ============ -->
<div class="card mb-16">
  <div class="card-head">
    <h2>上传制度文档</h2>
    <span class="sub">支持 Markdown / TXT / PDF，上传后自动切片并向量化入库</span>
  </div>
  <div class="card-body">
    <form method="post" action="/admin/knowledge/upload" enctype="multipart/form-data">
      <label class="upload-zone" for="kb-file">
        <input class="file-input" type="file" id="kb-file" name="file"
               accept=".md,.markdown,.txt,.pdf" required>
        <strong>点击选择文件</strong>
        <p>单个文件建议不超过 10MB。PDF 若为扫描件需先 OCR，否则抽不到文字。</p>
      </label>
      <div class="flex mt-16">
        <button class="btn btn-primary" type="submit">上传并索引</button>
        <span class="text-muted text-sm">
          切片尺寸 500 字，切分不跨章节
        </span>
      </div>
    </form>
  </div>
</div>

<!-- ============ 文档列表 ============ -->
<div class="card">
  <div class="card-head">
    <h2>已上传文档</h2>
    <span class="sub">共 1 份 · 索引内切片 11 块</span>
  </div>
  <div class="card-body tight">
    
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>文件名</th>
            <th>类型</th>
            <th>大小</th>
            <th>切片数</th>
            <th>状态</th>
            <th>上传时间</th>
            <th style="width:150px">操作</th>
          </tr>
        </thead>
        <tbody>
        
          <tr>
            <td class="cell-strong">报销制度.md</td>
            <td><span class="tag tag-muted">md</span></td>
            <td class="cell-muted">4.7 KB</td>
            <td>11</td>
            <td>
              
                <span class="tag tag-ok">就绪</span>
              
            </td>
            <td class="cell-muted nowrap">2026-10-30 11:03</td>
            <td>
              <a class="btn btn-ghost btn-sm" href="/admin/knowledge/documents/doc_56c0b1af0e2c4b4c/chunks">切片</a>
              <form method="post" action="/admin/knowledge/documents/doc_56c0b1af0e2c4b4c/delete"
                    style="display:inline"
                    onsubmit="return confirm('确认删除《报销制度.md》？\n删除后该文档的切片会立即从检索索引中移除。');">
                <button class="btn btn-ghost btn-sm text-danger" type="submit">删除</button>
              </form>
            </td>
          </tr>
          
        
        </tbody>
      </table>
    </div>
    
  </div>
</div>


    </div>
  </main>
</body>
</html>
